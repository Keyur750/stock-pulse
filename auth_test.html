<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Undertow — Auth Sandbox (Test Only)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root {
    --bg-primary: #0B1626; --surface-1: #101C2D; --surface-2: #142238;
    --text-primary: #F5F7FA; --text-secondary: #94A3B8; --text-faint: #5B6B84;
    --border: #22324A; --border-hover: #314764;
    --accent: #3B82F6; --accent-dim: rgba(59,130,246,0.10); --accent-border: rgba(59,130,246,0.30);
    --bull: #10B981; --bull-soft: rgba(16,185,129,0.12);
    --bear: #EF4444; --bear-soft: rgba(239,68,68,0.12);
    --amber: #F59E0B; --amber-soft: rgba(245,158,11,0.12);
    --radius-md: 10px; --radius-lg: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--text-primary); font-family: 'Inter', sans-serif;
    background: var(--bg-primary); display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .sandbox-banner {
    position: fixed; top: 0; left: 0; right: 0; background: var(--amber-soft); color: var(--amber);
    text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; font-weight: 700;
    letter-spacing: 0.04em; padding: 8px; border-bottom: 1px solid rgba(245,158,11,0.3);
  }
  .card {
    width: 100%; max-width: 400px; background: var(--surface-1); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 32px 28px; margin-top: 40px;
  }
  .brand { display: flex; align-items: center; gap: 9px; margin-bottom: 4px; }
  .brand-mark { width: 28px; height: 28px; border-radius: 7px; background: var(--surface-2); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; }
  .brand-word { font-size: 15px; font-weight: 800; letter-spacing: -0.01em; }
  .card-sub { font-size: 12.5px; color: var(--text-faint); margin: 6px 0 24px; }

  .tabs { display: flex; gap: 6px; margin-bottom: 20px; background: var(--surface-2); padding: 4px; border-radius: var(--radius-md); }
  .tab-btn { flex: 1; background: transparent; border: none; color: var(--text-secondary); font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; padding: 8px; border-radius: 7px; cursor: pointer; transition: background-color .15s ease, color .15s ease; }
  .tab-btn.active { background: var(--accent); color: #fff; }

  form { display: none; flex-direction: column; gap: 12px; }
  form.active { display: flex; }
  label { font-size: 12px; color: var(--text-secondary); font-weight: 600; }
  input {
    width: 100%; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-md);
    color: var(--text-primary); font-family: 'Inter', sans-serif; font-size: 14px; padding: 10px 12px; outline: none;
    transition: border-color .15s ease;
  }
  input:focus { border-color: var(--accent-border); }
  .field { display: flex; flex-direction: column; gap: 5px; }
  button[type="submit"] {
    margin-top: 6px; background: var(--accent); color: #fff; border: none; border-radius: var(--radius-md);
    font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 700; padding: 11px; cursor: pointer;
    transition: filter .15s ease;
  }
  button[type="submit"]:hover { filter: brightness(1.1); }
  button[type="submit"]:disabled { opacity: 0.6; cursor: not-allowed; }

  .message { font-size: 12.5px; padding: 10px 12px; border-radius: var(--radius-md); margin-top: 14px; line-height: 1.5; display: none; }
  .message.show { display: block; }
  .message.success { background: var(--bull-soft); color: var(--bull); }
  .message.error { background: var(--bear-soft); color: var(--bear); }
  .message.info { background: var(--accent-dim); color: var(--accent); }

  .session-view { display: none; flex-direction: column; align-items: center; text-align: center; gap: 14px; }
  .session-view.active { display: flex; }
  .session-badge { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--bull); background: var(--bull-soft); padding: 5px 12px; border-radius: 20px; }
  .session-email { font-size: 16px; font-weight: 700; }
  .session-meta { font-size: 11.5px; color: var(--text-faint); font-family: 'JetBrains Mono', monospace; word-break: break-all; }
  .logout-btn {
    background: var(--surface-2); color: var(--text-primary); border: 1px solid var(--border); border-radius: var(--radius-md);
    font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 700; padding: 10px 20px; cursor: pointer; margin-top: 6px;
  }
  .logout-btn:hover { border-color: var(--border-hover); background: var(--surface-2); }

  .divider { display: flex; align-items: center; gap: 10px; margin: 18px 0; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .divider span { font-size: 11px; color: var(--text-faint); font-family: 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: 0.05em; }
  .oauth-btn {
    width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
    background: #fff; color: #1f1f1f; border: 1px solid var(--border); border-radius: var(--radius-md);
    font-family: 'Inter', sans-serif; font-size: 13.5px; font-weight: 600; padding: 10px; cursor: pointer;
    transition: filter .15s ease;
  }
  .oauth-btn:hover { filter: brightness(0.96); }
</style>
</head>
<body>

<div class="sandbox-banner">⚠ SANDBOX — TEST ONLY, NOT PART OF THE LIVE UNDERTOW SITE</div>

<div class="card">
  <div class="brand">
    <div class="brand-mark"><svg width="14" height="14" viewBox="0 0 32 32" fill="none"><path d="M4,20 C8,11 12,11 16,17.5 C20,24 24,24 28,13" stroke="#3B82F6" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <span class="brand-word">UNDERTOW</span>
  </div>
  <p class="card-sub">Auth sandbox — testing sign up / log in against a real Supabase project.</p>

  <div id="logged-out-view">
    <div class="tabs">
      <button class="tab-btn active" id="tab-login">Log In</button>
      <button class="tab-btn" id="tab-signup">Sign Up</button>
    </div>

    <form id="login-form" class="active">
      <div class="field"><label for="login-email">Email</label><input type="email" id="login-email" required autocomplete="email"></div>
      <div class="field"><label for="login-password">Password</label><input type="password" id="login-password" required autocomplete="current-password"></div>
      <button type="submit">Log In</button>
    </form>

    <form id="signup-form">
      <div class="field"><label for="signup-email">Email</label><input type="email" id="signup-email" required autocomplete="email"></div>
      <div class="field"><label for="signup-password">Password (6+ characters)</label><input type="password" id="signup-password" required minlength="6" autocomplete="new-password"></div>
      <button type="submit">Create Account</button>
    </form>

    <div class="message" id="message"></div>

    <div class="divider"><span>or</span></div>
    <button type="button" class="oauth-btn" id="google-btn">
      <svg width="16" height="16" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.68-3.87 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.03l2.99-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.97l2.99 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
      Continue with Google
    </button>
  </div>

  <div class="session-view" id="session-view">
    <span class="session-badge">● Logged in</span>
    <div class="session-email" id="session-email"></div>
    <div class="session-meta" id="session-id"></div>
    <button class="logout-btn" id="logout-btn">Log Out</button>
  </div>
</div>

<script>
// Values from the "Settings → API" page of the Undertow Supabase
// project. Only the URL and the publishable/anon key live here —
// both are designed to be public/browser-safe. The service_role key
// must never appear in any file like this one.
const SUPABASE_URL = 'https://kxgfwqteiosancwozcgo.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_13iV4lUM5MD5FaRxhvcWvA_Cv5gtAfI';

const { createClient } = supabase;
const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const loggedOutView = document.getElementById('logged-out-view');
const sessionView = document.getElementById('session-view');
const messageEl = document.getElementById('message');
const tabLogin = document.getElementById('tab-login');
const tabSignup = document.getElementById('tab-signup');
const loginForm = document.getElementById('login-form');
const signupForm = document.getElementById('signup-form');

function showMessage(text, type) {
  messageEl.textContent = text;
  messageEl.className = `message show ${type}`;
}
function clearMessage() {
  messageEl.className = 'message';
}

tabLogin.addEventListener('click', () => {
  tabLogin.classList.add('active'); tabSignup.classList.remove('active');
  loginForm.classList.add('active'); signupForm.classList.remove('active');
  clearMessage();
});
tabSignup.addEventListener('click', () => {
  tabSignup.classList.add('active'); tabLogin.classList.remove('active');
  signupForm.classList.add('active'); loginForm.classList.remove('active');
  clearMessage();
});

function renderSession(session) {
  if (session && session.user) {
    loggedOutView.style.display = 'none';
    sessionView.classList.add('active');
    document.getElementById('session-email').textContent = session.user.email;
    document.getElementById('session-id').textContent = `user id: ${session.user.id}`;
  } else {
    loggedOutView.style.display = 'block';
    sessionView.classList.remove('active');
  }
}

// Check for an existing session on load (e.g. if you refresh this page
// after logging in — Supabase keeps the session in the browser).
client.auth.getSession().then(({ data }) => renderSession(data.session));
client.auth.onAuthStateChange((_event, session) => renderSession(session));

signupForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  clearMessage();
  const email = document.getElementById('signup-email').value;
  const password = document.getElementById('signup-password').value;
  const btn = signupForm.querySelector('button[type="submit"]');
  btn.disabled = true;
  const { data, error } = await client.auth.signUp({ email, password });
  btn.disabled = false;
  if (error) {
    showMessage(error.message, 'error');
    return;
  }
  if (data.user && !data.session) {
    showMessage('Account created. Check your email for a confirmation link before logging in — Supabase requires this by default.', 'info');
  } else {
    showMessage('Account created and logged in.', 'success');
  }
});

loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  clearMessage();
  const email = document.getElementById('login-email').value;
  const password = document.getElementById('login-password').value;
  const btn = loginForm.querySelector('button[type="submit"]');
  btn.disabled = true;
  const { error } = await client.auth.signInWithPassword({ email, password });
  btn.disabled = false;
  if (error) {
    showMessage(error.message, 'error');
  }
});

document.getElementById('logout-btn').addEventListener('click', async () => {
  await client.auth.signOut();
});

document.getElementById('google-btn').addEventListener('click', async () => {
  clearMessage();
  // Redirects to Google, then back to this exact page once you approve —
  // Supabase handles exchanging that for a real session automatically,
  // onAuthStateChange above picks it up when the page reloads.
  const { error } = await client.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.href },
  });
  if (error) showMessage(error.message, 'error');
});
</script>

</body>
</html>
