name: Update Undertow Dashboard

on:
  schedule:
    # 12:30 UTC ≈ 7:30/8:30am US Eastern depending on daylight saving.
    # Change the time here if you want a different daily run time —
    # this field is always in UTC, not your local time.
    - cron: '30 12 * * *'
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Undertow
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python main.py

      - name: Commit and push updated dashboard
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/dashboard.html docs/sentiment.html docs/stock.html docs/.nojekyll docs/logos data/history.json data/analyst_history.json data/signal_history.json
          git diff --staged --quiet && exit 0
          git commit -m "Update dashboard $(date -u +'%Y-%m-%d %H:%M UTC')"

          # This job takes 20-30+ minutes, and the quotes-refresh job (every
          # 15 min) commits to main the whole time it's running -- a bare
          # push loses that race more often than not. The two jobs never
          # touch the same files (this one: docs/dashboard.html, docs/
          # sentiment.html, data/*.json; quotes-refresh: docs/quotes.json
          # only), so rebasing onto the latest main is always a pure
          # reorder, never a real conflict -- safe to retry automatically.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5) -- rebasing onto latest origin/main and retrying..."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase hit a real conflict (unexpected -- these workflows shouldn't touch the same files). Aborting."
              git rebase --abort
              exit 1
            fi
            sleep 5
          done
          echo "Failed to push after 5 attempts."
          exit 1
