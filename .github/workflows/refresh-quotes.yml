name: Refresh Live Quotes

on:
  schedule:
    # Every 15 minutes — a price-only refresh, separate from the full
    # daily pipeline. GitHub's scheduler doesn't reliably run faster than
    # this and may delay further during high load, so this is "current
    # within the last several minutes," not tick-by-tick streaming.
    - cron: '*/15 * * * *'
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance>=0.2.40 pandas_market_calendars>=4.4.0

      - name: Refresh quotes
        run: python refresh_quotes.py

      - name: Commit and push updated quotes
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/quotes.json
          git diff --staged --quiet && exit 0
          git commit -m "Refresh live quotes $(date -u +'%Y-%m-%d %H:%M UTC')"

          # Same race as update-dashboard.yml: this can land while that
          # ~30-minute job is mid-run. The two never touch the same files
          # (this one: docs/quotes.json only), so a rebase onto the latest
          # main is always a pure reorder, never a real conflict.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5) -- rebasing onto latest origin/main and retrying..."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase hit a real conflict (unexpected -- these workflows shouldn't touch the same files). Aborting."
              git rebase --abort
              exit 1
            fi
            sleep 5
          done
          echo "Failed to push after 5 attempts."
          exit 1
